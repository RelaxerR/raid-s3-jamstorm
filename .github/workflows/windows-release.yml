name: Release builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.5.1f1
  PROJECT_NAME: raid-s3-jamstorm

jobs:
  version:
    name: Read Unity player version
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.settings.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read version from project settings
        id: settings
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Unity bundleVersion must use major.minor.patch.'
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows player
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Test Windows packaging
        run: python3 tools/test_package_windows_player.py

      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          versioning: Custom
          version: ${{ needs.version.outputs.number }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.PROJECT_NAME }}
          buildsPath: build

      - name: Archive and verify Windows player
        run: bash tools/package_windows_player.sh "$PROJECT_NAME"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-Windows.zip
          path: ${{ env.PROJECT_NAME }}-Windows.zip
          if-no-files-found: error
          archive: false
          overwrite: true

  windows-smoke:
    name: Launch Windows player
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.PROJECT_NAME }}-Windows.zip
          skip-decompress: true

      - name: Extract and launch standalone player
        shell: pwsh
        run: |
          Expand-Archive "$env:PROJECT_NAME-Windows.zip" -DestinationPath player
          $exe = Join-Path "$PWD/player" "$env:PROJECT_NAME.exe"
          $log = Join-Path "$PWD" "player.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) `
            -ArgumentList "-batchmode", "-nographics", "-logFile", "`"$log`"" -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) { throw "Windows player exited early ($($process.ExitCode))." }
            if (!(Test-Path $log) -or !(Select-String -Path $log -SimpleMatch 'Initialize engine version')) {
              throw 'Windows player did not log Unity engine initialization.'
            }
            'Extracted Windows Player initialized and stayed running.' >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
            if (Test-Path $log) { Get-Content $log -Tail 80 }
          }

  macos:
    name: Build macOS Universal player
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Build macOS Universal player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          versioning: Custom
          version: ${{ needs.version.outputs.number }}
          targetPlatform: StandaloneOSX
          buildName: ${{ env.PROJECT_NAME }}
          buildsPath: build
          buildMethod: RaidS3Jamstorm.Editor.CiBuild.BuildMacOSUniversal
          customParameters: -outputPath build/StandaloneOSX/${{ env.PROJECT_NAME }}.app

      - name: Archive and verify macOS player
        run: |
          archive="$PWD/${PROJECT_NAME}-macOS-Universal.zip"
          bundle="${PROJECT_NAME}.app"
          cd build/StandaloneOSX
          executable=$(python3 -c 'import plistlib, sys; print(plistlib.load(open(sys.argv[1], "rb"))["CFBundleExecutable"])' "$bundle/Contents/Info.plist")
          test -x "$bundle/Contents/MacOS/$executable"
          zip -qry "$archive" "$bundle"
          unzip -tq "$archive"
          unzip -Z -1 "$archive" "$bundle/Contents/MacOS/$executable"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-macOS-Universal.zip
          path: ${{ env.PROJECT_NAME }}-macOS-Universal.zip
          if-no-files-found: error
          archive: false
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: [version, windows-smoke, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-${{ needs.version.outputs.number }}
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.number }}
    permissions:
      contents: write
    steps:
      - name: Check the version tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="refs/tags/v$RELEASE_VERSION"
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/${tag#refs/}" --jq '.[] | [.ref, .object.sha] | @tsv')
          tagged_sha=$(awk -v tag="$tag" '$1 == tag { print $2 }' <<< "$refs")
          if [[ -n "$tagged_sha" && "$tagged_sha" != "$GITHUB_SHA" ]]; then
            echo "v$RELEASE_VERSION already identifies another commit. ZIPs are available in this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.publish == 'true'
        with:
          pattern: ${{ env.PROJECT_NAME }}-*.zip
          merge-multiple: true
          skip-decompress: true
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: raid-s3-jamstorm v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.PROJECT_NAME }}-Windows.zip
            ${{ env.PROJECT_NAME }}-macOS-Universal.zip
